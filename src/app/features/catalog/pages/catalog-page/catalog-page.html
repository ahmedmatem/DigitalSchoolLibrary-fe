<sl-page-container>
  <div style="max-width: 600px;">
    <sl-search-field
      placeholder="Търсене по заглавие, предмет или автор..."
      [value]="searchQuery()"
      (valueChange)="searchQuery.set($event)"
    />
  </div>

  <p>
    Търсиш: {{ searchQuery() }}
  </p>
</sl-page-container>

<div
>
  <sl-icon-button
    ariaLabel="Отвори меню"
    size="sm"
  >
    <svg lucideMenu></svg>
  </sl-icon-button>

  <sl-icon-button
    ariaLabel="Търсене"
    variant="ghost"
  >
    <svg lucideSearch></svg>
  </sl-icon-button>

  <sl-icon-button
    ariaLabel="Запази"
    variant="primary"
  >
    <svg lucideBookmark></svg>
  </sl-icon-button>

  <sl-icon-button
    ariaLabel="Изтрий"
    variant="danger"
    size="lg"
  >
    <svg lucideTrash2></svg>
  </sl-icon-button>
</div>

<div class="app-shell">

  <sl-app-header
    (menuClick)="openMobileMenu()"
  />

  <sl-mobile-navigation
    [open]="mobileMenuOpen()"
    [authenticated]="authenticated()"
    [displayName]="displayName()"
    [role]="role()"
    (close)="closeMobileMenu()"
    (logout)="logout()"
  />

  <main class="app-shell__main">
    <router-outlet />
  </main>

</div>

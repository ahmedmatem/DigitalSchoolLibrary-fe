<span
  class="sl-skeleton"
  [class.sl-skeleton--sm]="radius() === 'sm'"
  [class.sl-skeleton--md]="radius() === 'md'"
  [class.sl-skeleton--lg]="radius() === 'lg'"
  [class.sl-skeleton--round]="radius() === 'round'"

  [style.width]="width()"
  [style.height]="height()"

  aria-hidden="true"
></span>

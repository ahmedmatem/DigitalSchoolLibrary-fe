<main class="access-denied">

  <section
    class="access-denied__card"
    aria-labelledby="access-denied-title"
  >

    <div
      class="access-denied__visual"
      aria-hidden="true"
    >
      !
    </div>

    <h1
      id="access-denied-title"
      class="access-denied__title"
    >
      Нямате достъп до тази страница
    </h1>

    <p class="access-denied__description">
      Вашият профил няма необходимите права за тази
      секция. Можете да се върнете към достъпните за
      вас ресурси.
    </p>

    <div class="access-denied__actions">

      <a
        class="
          access-denied__action
          access-denied__action--primary
        "
        routerLink="/"
      >
        Към каталога
      </a>

      <a
        class="
          access-denied__action
          access-denied__action--secondary
        "
        routerLink="/profile"
      >
        Към профила
      </a>

    </div>

  </section>

</main>
